<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Sensor History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui'] } } } };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/app.css?v=20260906-observatory">
  <script src="https://cdn.jsdelivr.net/npm/highcharts@12.4.0/highcharts.js"></script>
</head>
<body class="history-page">
  <div class="ops-shell">
    <aside id="appRail" class="ops-rail" aria-label="Application navigation"></aside>
    <main id="mainContent" tabindex="-1" class="ops-main min-w-0">
      <header class="ops-topbar sticky top-0 z-30">
        <div class="flex items-center gap-3"><a href="/" class="ops-button ops-button-ghost" aria-label="Back to dashboard"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></a><div class="ops-heading"><p class="ops-eyebrow">Observatory / Data archive</p><h1 class="ops-page-title">Sensor history</h1></div></div>
        <span id="queryState" class="ops-status-chip tone-warn" role="status" aria-live="polite"><i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i><span>Loading</span></span>
      </header>

      <div class="ops-page-intro"><p class="ops-eyebrow">Instrument archive</p><h2>Observe the longer view.</h2><p>Sensor measurements over time. The dotted series compares the previous period.</p></div>
      <div class="mx-auto w-full max-w-[100rem] space-y-3 p-3">
        <section class="ops-card">
          <header class="ops-card-header flex-wrap">
            <h2 id="sensorTitle" class="ops-card-title">Sensor History</h2>
            <div class="flex flex-wrap gap-1.5" role="group" aria-label="History range">
              <button type="button" data-range="day" class="range-btn ops-button ops-button-primary"><i class="fa-solid fa-clock" aria-hidden="true"></i>Last 24h</button>
              <button type="button" data-range="yesterday" class="range-btn ops-button"><i class="fa-solid fa-calendar-day" aria-hidden="true"></i>Yesterday</button>
              <button type="button" data-range="week" class="range-btn ops-button"><i class="fa-solid fa-calendar-week" aria-hidden="true"></i>This week</button>
            </div>
          </header>
          <div class="ops-card-body">
            <div id="historyChart" class="h-[65vh] min-h-[22rem]"></div>
          </div>
        </section>

        <details id="debugPanel" class="ops-card">
          <summary class="ops-card-header cursor-pointer list-none"><span class="ops-card-title"><i class="fa-solid fa-bug mr-2 text-blue-600" aria-hidden="true"></i>Debug details</span></summary>
          <div class="ops-card-body space-y-3">
            <div id="debugList" class="grid gap-2 sm:grid-cols-2 lg:grid-cols-4"></div>
            <pre id="debugLog" class="max-h-52 overflow-auto rounded-lg border bg-[var(--panel-subtle)] p-3 text-xs text-[var(--muted)]" style="border-color:var(--border)"></pre>
          </div>
        </details>
      </div>
    </main>
  </div>

  <script type="module">
    import { loadConfig } from './js/mqttConfig.js';
    import { initShell } from './js/shell.js?v=20260906-observatory';

    const params = new URLSearchParams(window.location.search);
    const sensorPath = params.get('sensor');
    const queryState = document.getElementById('queryState');
    const debugList = document.getElementById('debugList');
    const debugLog = document.getElementById('debugLog');
    let historyChart;
    let currentContext = {};

    if (params.has('debug')) document.getElementById('debugPanel').open = true;

    function chartColors() {
      const style = getComputedStyle(document.documentElement);
      const token = name => style.getPropertyValue(name).trim();
      return { text: token('--text'), muted: token('--muted-soft'), grid: token('--border'), tooltip: token('--panel-raised'), border: token('--border-strong') };
    }

    function applyChartTheme() {
      const colors = chartColors();
      Highcharts.setOptions({
        chart: { backgroundColor: 'transparent', plotBackgroundColor: 'transparent' },
        xAxis: { gridLineColor: colors.grid, lineColor: colors.grid, tickColor: colors.grid, labels: { style: { color: colors.muted } } },
        yAxis: { gridLineColor: colors.grid, lineColor: colors.grid, tickColor: colors.grid, labels: { style: { color: colors.muted } }, title: { style: { color: colors.muted } } },
        legend: { itemStyle: { color: colors.text }, itemHoverStyle: { color: colors.text } },
        tooltip: { backgroundColor: colors.tooltip, borderColor: colors.border, style: { color: colors.text }, valueDecimals: 1 }
      });
      if (historyChart) {
        historyChart.update({
          xAxis: { gridLineColor: colors.grid, lineColor: colors.grid, tickColor: colors.grid, labels: { style: { color: colors.muted } } },
          yAxis: { gridLineColor: colors.grid, lineColor: colors.grid, tickColor: colors.grid, labels: { style: { color: colors.muted } }, title: { style: { color: colors.muted } } },
          legend: { itemStyle: { color: colors.text }, itemHoverStyle: { color: colors.text } },
          tooltip: { backgroundColor: colors.tooltip, borderColor: colors.border, style: { color: colors.text } }
        }, true, true);
      }
    }

    function setQueryState(label, tone, icon, spin = false) {
      queryState.classList.remove('tone-good', 'tone-warn', 'tone-bad', 'tone-info');
      queryState.classList.add(`tone-${tone}`);
      queryState.querySelector('i').className = `fa-solid ${icon}${spin ? ' fa-spin' : ''}`;
      queryState.querySelector('span').textContent = label;
    }

    function maskToken(token) {
      if (!token) return 'missing';
      return token.length <= 8 ? `${token.slice(0, 2)}…` : `${token.slice(0, 4)}…${token.slice(-4)}`;
    }

    function appendDebug(message) {
      const line = `[${new Date().toLocaleTimeString('en-GB')}] ${message}`;
      debugLog.textContent = debugLog.textContent ? `${debugLog.textContent}\n${line}` : line;
      debugLog.scrollTop = debugLog.scrollHeight;
    }

    function renderDebug(extra = {}) {
      const entries = { ...currentContext, ...extra };
      debugList.replaceChildren();
      Object.entries(entries).forEach(([label, value]) => {
        const row = document.createElement('div');
        row.className = 'rounded-lg border bg-[var(--panel-subtle)] p-2';
        row.style.borderColor = 'var(--border)';
        const key = document.createElement('div');
        key.className = 'text-[.62rem] font-extrabold uppercase tracking-wide text-[var(--muted-soft)]';
        key.textContent = label;
        const content = document.createElement('div');
        content.className = 'mt-1 truncate text-xs font-bold text-[var(--text)]';
        content.textContent = String(value ?? 'missing');
        row.append(key, content);
        debugList.appendChild(row);
      });
    }

    function parseInfluxCsv(text) {
      const lines = text.trim().split('\n').filter(line => line && !line.startsWith('#'));
      if (lines.length < 2) return [];
      const headers = lines[0].split(',');
      const timeIndex = headers.indexOf('_time');
      const valueIndex = headers.indexOf('_value');
      if (timeIndex < 0 || valueIndex < 0) return [];
      return lines.slice(1).map(line => {
        const parts = line.split(',');
        return [new Date(parts[timeIndex]).getTime(), Math.round(Number.parseFloat(parts[valueIndex]) * 10) / 10];
      }).filter(point => Number.isFinite(point[0]) && Number.isFinite(point[1]));
    }

    try {
      const config = await loadConfig();
      initShell({ quickLinks: config.quickLinks });
      applyChartTheme();
      window.addEventListener('observatory-theme-change', applyChartTheme);

      const sensor = config.sensors.find(item => item.path === sensorPath);
      currentContext = {
        'Sensor path': sensorPath || 'missing', 'Sensor found': sensor ? 'yes' : 'no',
        'Influx host': config.influxHost || 'missing', 'Influx org': config.influxOrg || 'missing',
        'Influx bucket': config.influxBucket || 'missing', 'Influx token': maskToken(config.influxToken)
      };
      if (sensor) {
        currentContext.Measurement = sensor.influxMeasurement || 'missing';
        currentContext.Field = sensor.influxField || 'missing';
      }
      renderDebug();

      if (!sensor || !sensor.influxMeasurement || !sensor.influxField) throw new Error('No historical data is configured for this sensor.');
      if (!config.influxHost || !config.influxOrg || !config.influxBucket || !config.influxToken) throw new Error('InfluxDB settings are incomplete.');
      document.getElementById('sensorTitle').textContent = `${sensor.name} History`;

      const ranges = {
        day: { label: 'Last 24h', duration: 86400000, window: '30m', offset: 0 },
        yesterday: { label: 'Yesterday', duration: 86400000, window: '30m', offset: 86400000 },
        week: { label: 'This week', duration: 604800000, window: '2h', offset: 0 }
      };

      function buildFlux(start, stop, windowSize) {
        return `from(bucket: "${config.influxBucket}")\n  |> range(start: ${start}, stop: ${stop})\n  |> filter(fn: (r) => r["_measurement"] == "${sensor.influxMeasurement}")\n  |> filter(fn: (r) => r["_field"] == "${sensor.influxField}")\n  |> aggregateWindow(every: ${windowSize}, fn: mean, createEmpty: false)\n  |> yield(name: "mean")`;
      }

      async function queryInflux(flux) {
        const url = `${config.influxHost.replace(/\/$/, '')}/api/v2/query?org=${encodeURIComponent(config.influxOrg)}`;
        appendDebug(`POST ${url}`);
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/vnd.flux', Accept: 'application/csv', Authorization: `Token ${config.influxToken}` },
          body: flux
        });
        if (!response.ok) throw new Error(`Influx query failed: ${response.status} ${response.statusText}`);
        return response.text();
      }

      async function fetchData(rangeKey) {
        const range = ranges[rangeKey];
        document.querySelectorAll('.range-btn').forEach(button => {
          button.classList.toggle('ops-button-primary', button.dataset.range === rangeKey);
          button.setAttribute('aria-pressed', String(button.dataset.range === rangeKey));
        });
        setQueryState('Querying', 'info', 'fa-circle-notch', true);
        const stop = Date.now() - range.offset;
        const start = stop - range.duration;
        const previousStart = start - range.duration;
        renderDebug({ Range: range.label, Status: 'Querying' });
        try {
          const [currentText, previousText] = await Promise.all([
            queryInflux(buildFlux(new Date(start).toISOString(), new Date(stop).toISOString(), range.window)),
            queryInflux(buildFlux(new Date(previousStart).toISOString(), new Date(start).toISOString(), range.window))
          ]);
          const current = parseInfluxCsv(currentText);
          const previous = parseInfluxCsv(previousText).map(([timestamp, value]) => [timestamp + range.duration, value]);
          historyChart?.destroy();
          historyChart = Highcharts.chart('historyChart', {
            chart: { style: { fontFamily: 'IBM Plex Mono, monospace' }, type: 'line', backgroundColor: 'transparent', animation: false },
            title: { text: null }, xAxis: { type: 'datetime' },
            yAxis: { title: { text: sensor.unit || null }, labels: { formatter() { return Highcharts.numberFormat(this.value, 1); } } },
            series: [
              { name: sensor.name, data: current, marker: { enabled: false }, tooltip: { valueSuffix: sensor.unit ? ` ${sensor.unit}` : '' } },
              { name: `${sensor.name} (previous)`, data: previous, dashStyle: 'ShortDot', color: '#94a3b8', marker: { enabled: false }, tooltip: { valueSuffix: sensor.unit ? ` ${sensor.unit}` : '' } }
            ],
            credits: { enabled: false }, accessibility: { enabled: false }
          });
          const count = current.length + previous.length;
          setQueryState(count ? `${current.length} points` : 'No data', count ? 'good' : 'warn', count ? 'fa-check' : 'fa-minus');
          renderDebug({ Range: range.label, Status: count ? `Loaded ${current.length} current and ${previous.length} previous points` : 'No rows returned' });
        } catch (error) {
          appendDebug(error.message);
          setQueryState('Query failed', 'bad', 'fa-triangle-exclamation');
          renderDebug({ Range: range.label, Status: error.message });
        }
      }

      document.querySelectorAll('.range-btn').forEach(button => button.addEventListener('click', () => fetchData(button.dataset.range)));
      fetchData('day');
    } catch (error) {
      console.error('History initialization failed:', error);
      initShell({ quickLinks: [] });
      document.getElementById('sensorTitle').textContent = error.message;
      setQueryState('Unavailable', 'bad', 'fa-triangle-exclamation');
      appendDebug(error.message);
    }
  </script>
</body>
</html>
