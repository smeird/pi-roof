<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Observatory Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui'] } } } };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="js/mqttClient.js"></script>
  <script src="https://code.highcharts.com/highcharts.js"></script>
</head>
<body class="dashboard-page">
  <div class="ops-shell">
    <aside id="appRail" class="ops-rail" aria-label="Application navigation"></aside>

    <main class="ops-main dashboard-main">
      <header class="ops-topbar">
        <div class="flex min-w-0 items-center gap-3">
          <h1 class="ops-page-title">Observatory Control</h1>
          <span id="roofSummary" class="ops-status-chip tone-warn"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Roof waiting</span></span>
        </div>
        <div class="ops-topbar-status">
          <span id="connectionStatus" class="ops-status-chip tone-warn" role="status" aria-live="polite">
            <i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i><span id="statusText">Connecting</span>
          </span>
        </div>
      </header>

      <div class="dashboard-grid">
        <section id="roofCard" class="ops-card dashboard-roof" aria-labelledby="roofTitle">
          <header class="ops-card-header">
            <h2 id="roofTitle" class="ops-card-title">Roof Control</h2>
            <span id="roofMovingBadge" class="ops-status-chip tone-warn" hidden><i class="fa-solid fa-arrows-up-down" aria-hidden="true"></i> Moving</span>
          </header>
          <div class="ops-card-body flex h-[calc(100%-2.65rem)] flex-col gap-3 overflow-hidden">
            <div id="roofControls" class="grid grid-cols-2 gap-2" aria-label="Roof commands"></div>
            <div class="flex items-center justify-between border-t pt-2" style="border-color: var(--border)">
              <h3 class="text-[.68rem] font-extrabold uppercase tracking-[.08em] text-[var(--muted)]">Controller telemetry</h3>
              <span id="lastCommand" class="text-[.65rem] font-semibold text-[var(--muted-soft)]">No command sent</span>
            </div>
            <div id="roofStatus" class="grid min-h-0 flex-1 grid-cols-2 content-start gap-1.5"></div>
          </div>
        </section>

        <section id="sensorCard" class="ops-card dashboard-sensors" aria-labelledby="sensorTitle">
          <header class="ops-card-header">
            <div class="flex items-center gap-2">
              <h2 id="sensorTitle" class="ops-card-title">Sensors</h2>
              <span id="sensorSummary" class="ops-status-chip tone-warn">Waiting</span>
            </div>
            <div id="sensorPager" class="ops-pager" hidden>
              <button type="button" data-page="previous" aria-label="Previous sensors"><i class="fa-solid fa-chevron-left"></i></button>
              <span data-page-label>1/1</span>
              <button type="button" data-page="next" aria-label="Next sensors"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
          </header>
          <div class="ops-card-body h-[calc(100%-2.65rem)]">
            <div id="sensorsContainer" class="grid h-full grid-cols-2 content-start gap-1.5"></div>
          </div>
        </section>

        <section id="chartCard" class="ops-card dashboard-chart" aria-labelledby="chartTitle">
          <header class="ops-card-header">
            <h2 id="chartTitle" class="ops-card-title">Live Trends</h2>
            <button type="button" class="ops-button ops-button-ghost" data-maximize="chartCard" aria-label="Maximize live trends" aria-expanded="false"><i class="fa-solid fa-expand"></i></button>
          </header>
          <div class="ops-card-body h-[calc(100%-2.65rem)] p-1.5">
            <div id="lineChart" class="h-full min-h-[10rem]"></div>
          </div>
        </section>

        <section id="skyCamCard" class="ops-card dashboard-skycam" aria-labelledby="skyCamTitle">
          <header class="ops-card-header">
            <h2 id="skyCamTitle" class="ops-card-title">SkyCam</h2>
            <button type="button" class="ops-button ops-button-ghost" data-maximize="skyCamCard" aria-label="Maximize SkyCam" aria-expanded="false"><i class="fa-solid fa-expand"></i></button>
          </header>
          <div class="ops-card-body flex h-[calc(100%-2.65rem)] items-center justify-center bg-black p-0">
            <img id="skyCamImage" class="h-full w-full object-contain" alt="Live observatory sky camera" hidden>
            <span id="skyCamWaiting" class="absolute text-xs font-bold text-slate-400"><i class="fa-solid fa-camera mr-2"></i>Waiting for image</span>
          </div>
        </section>

        <section id="devicesCard" class="ops-card dashboard-devices" aria-labelledby="devicesTitle">
          <header class="ops-card-header">
            <h2 id="devicesTitle" class="ops-card-title">Devices</h2>
            <div id="devicePager" class="ops-pager" hidden>
              <button type="button" data-page="previous" aria-label="Previous devices"><i class="fa-solid fa-chevron-left"></i></button>
              <span data-page-label>1/1</span>
              <button type="button" data-page="next" aria-label="Next devices"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
          </header>
          <div class="ops-card-body h-[calc(100%-2.65rem)]">
            <div id="devicesContainer" class="grid content-start gap-1.5"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="modalBackdrop" class="ops-modal-backdrop" hidden></div>
  <div id="powerDialogBackdrop" class="ops-modal-backdrop" hidden></div>
  <div id="powerInterlockDialog" class="ops-dialog" role="alertdialog" aria-modal="true" aria-labelledby="powerDialogTitle" aria-describedby="powerDialogMessage" hidden>
    <div class="flex h-11 w-11 items-center justify-center rounded-full bg-amber-500/15 text-amber-600 dark:text-amber-300">
      <i class="fa-solid fa-bolt" aria-hidden="true"></i>
    </div>
    <div>
      <h2 id="powerDialogTitle" class="text-sm font-extrabold uppercase tracking-wide">12V power required</h2>
      <p id="powerDialogMessage" class="mt-2 text-sm leading-6 text-[var(--muted)]"></p>
    </div>
    <button id="dismissPowerDialog" type="button" class="ops-button ops-button-warning w-full">OK</button>
  </div>

  <script type="module">
    import { loadConfig } from './js/mqttConfig.js';
    import { createPager, initShell } from './js/shell.js';

    const fallbackConfig = {
      brokerUrl: '', port: 0, username: '', password: '', sensors: [], switches: [],
      skyCamTopic: '', quickLinks: [], dashboard: { showChart: true, showSkyCam: true },
      roofController: { baseTopic: 'Observatory/roof-esp', relays: [] }
    };
    let config = fallbackConfig;
    let configLoaded = true;
    try {
      config = { ...fallbackConfig, ...(await loadConfig()) };
    } catch (error) {
      configLoaded = false;
      console.error('Configuration load failed:', error);
    }

    initShell({ activePage: 'dashboard', quickLinks: config.quickLinks });

    const baseTopic = (config.roofController?.baseTopic || 'Observatory/roof-esp').replace(/\/+$/, '');
    const powerRelayStateTopic = `${baseTopic}/state/relay3`;
    const powerRelayLabel = config.roofController?.relays?.find(relay => relay.key === 'relay3')?.label || '12V Power Supply (CH3)';
    const roofEsp = {
      state: {
        online: `${baseTopic}/online`, openLimit: `${baseTopic}/open_limit`, closeLimit: `${baseTopic}/close_limit`,
        moving: `${baseTopic}/moving`, enabled: `${baseTopic}/enabled`, fault: `${baseTopic}/fault`,
        faultCode: `${baseTopic}/fault_code`, openMotor: `${baseTopic}/state/open_motor`,
        closeMotor: `${baseTopic}/state/close_motor`, heartbeat: `${baseTopic}/heartbeat`
      },
      command: {
        open: `${baseTopic}/command/open`, close: `${baseTopic}/command/close`, stop: `${baseTopic}/command/stop`,
        enabled: `${baseTopic}/command/enabled`, faultClear: `${baseTopic}/command/fault_clear`, beep: `${baseTopic}/command/beep`
      }
    };

    const topics = new Set();
    topics.add(powerRelayStateTopic);
    const staticTopics = new Set();
    const stateValues = {};
    const sensorValueEls = {};
    const sensorIndicators = {};
    const statusValueEls = {};
    const toggleButtonsByTopic = {};
    const relayToggleButtons = [];
    const roofMotionButtons = {};
    const lineSeries = {};
    const faultLabels = {
      BOTH_LIMITS: 'Both limits active', TIMEOUT_OPEN: 'Open timeout', TIMEOUT_CLOSE: 'Close timeout'
    };
    let mqttClient;
    let mqttConnected = false;
    let lastHeartbeatAt = null;
    let lineChart;
    let activeMaximized = null;
    let maximizeTrigger = null;

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function setTone(element, tone) {
      if (!element) return;
      element.classList.remove('tone-good', 'tone-warn', 'tone-bad', 'tone-info');
      if (tone) element.classList.add(`tone-${tone}`);
    }

    function createActionButton(label, icon, commandTopic, tone = 'primary', requires12V = false) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `ops-button ${tone === 'danger' ? 'ops-button-danger' : tone === 'warning' ? 'ops-button-warning' : 'ops-button-primary'}`;
      const glyph = makeElement('i', `fa-solid ${icon}`);
      glyph.setAttribute('aria-hidden', 'true');
      button.append(glyph, document.createTextNode(label));
      button.addEventListener('click', () => {
        if (requires12V && stateValues[powerRelayStateTopic] !== '1') {
          showPowerInterlock(label.toLowerCase());
          return;
        }
        sendCommand(commandTopic, '1', label);
      });
      return button;
    }

    function createToggle(label, stateTopic, commandTopic, kind = 'auxiliary') {
      const row = makeElement('div', 'flex min-h-[2.7rem] items-center justify-between gap-2 rounded-lg border px-2.5 py-1.5');
      row.style.borderColor = 'var(--border)';
      row.style.background = 'var(--panel-subtle)';
      const text = makeElement('div', 'min-w-0');
      text.appendChild(makeElement('div', 'truncate text-[.72rem] font-bold text-[var(--text)]', label));
      const state = makeElement('div', 'text-[.62rem] font-semibold text-[var(--muted-soft)]', 'Waiting for state');
      text.appendChild(state);
      const button = makeElement('button', 'ops-toggle');
      button.type = 'button';
      button.dataset.state = '0';
      button.dataset.stateTopic = stateTopic;
      button.dataset.commandTopic = commandTopic;
      button.setAttribute('role', 'switch');
      button.setAttribute('aria-label', label);
      button.setAttribute('aria-checked', 'false');
      button.appendChild(makeElement('span'));
      button.addEventListener('click', () => {
        const current = stateValues[stateTopic] === '1' ? '1' : button.dataset.state;
        const next = current === '1' ? '0' : '1';
        if (!(stateTopic in stateValues)) setToggleVisual(button, next, state);
        sendCommand(commandTopic, next, `${label} ${next === '1' ? 'on' : 'off'}`);
      });
      row.append(text, button);
      topics.add(stateTopic);
      toggleButtonsByTopic[stateTopic] = { button, state };
      if (kind === 'relay') relayToggleButtons.push(button);
      return row;
    }

    function setToggleVisual(button, value, stateLabel) {
      const isOn = value === '1';
      button.dataset.state = isOn ? '1' : '0';
      button.setAttribute('aria-checked', isOn ? 'true' : 'false');
      if (stateLabel) {
        stateLabel.textContent = isOn ? 'On' : 'Off';
        stateLabel.style.color = isOn ? 'var(--green)' : 'var(--muted-soft)';
      }
    }

    function renderRoofControls() {
      const container = document.getElementById('roofControls');
      const open = createActionButton('Open', 'fa-arrow-up', roofEsp.command.open, 'primary', true);
      const close = createActionButton('Close', 'fa-arrow-down', roofEsp.command.close, 'primary', true);
      const stop = createActionButton('Stop', 'fa-stop', roofEsp.command.stop, 'danger');
      const clear = createActionButton('Clear fault', 'fa-triangle-exclamation', roofEsp.command.faultClear, 'warning');
      const beep = createActionButton('Buzzer', 'fa-bell', roofEsp.command.beep);
      const enableWrap = makeElement('div', 'flex min-h-[2.3rem] items-center justify-between rounded-lg border px-2.5');
      enableWrap.style.borderColor = 'var(--border)';
      enableWrap.style.background = 'var(--panel-subtle)';
      enableWrap.appendChild(makeElement('span', 'text-[.72rem] font-extrabold', 'Motion enabled'));
      const enable = makeElement('button', 'ops-toggle');
      enable.type = 'button';
      enable.dataset.state = '0';
      enable.dataset.stateTopic = roofEsp.state.enabled;
      enable.dataset.commandTopic = roofEsp.command.enabled;
      enable.setAttribute('role', 'switch');
      enable.setAttribute('aria-label', 'Motion enabled');
      enable.setAttribute('aria-checked', 'false');
      enable.appendChild(makeElement('span'));
      enable.addEventListener('click', () => {
        const next = stateValues[roofEsp.state.enabled] === '1' ? '0' : '1';
        sendCommand(roofEsp.command.enabled, next, `Motion ${next === '1' ? 'enabled' : 'disabled'}`);
      });
      enableWrap.appendChild(enable);
      toggleButtonsByTopic[roofEsp.state.enabled] = { button: enable };
      roofMotionButtons.open = open;
      roofMotionButtons.close = close;
      roofMotionButtons.stop = stop;
      container.append(open, close, stop, clear, enableWrap, beep);
    }

    const statusDefinitions = [
      ['Online', 'online', roofEsp.state.online], ['Moving', 'moving', roofEsp.state.moving],
      ['Open limit', 'openLimit', roofEsp.state.openLimit], ['Closed limit', 'closeLimit', roofEsp.state.closeLimit],
      ['Open motor', 'openMotor', roofEsp.state.openMotor], ['Close motor', 'closeMotor', roofEsp.state.closeMotor],
      ['Enabled', 'enabled', roofEsp.state.enabled], ['Fault', 'fault', roofEsp.state.fault],
      ['Fault code', 'faultCode', roofEsp.state.faultCode], ['Heartbeat', 'heartbeat', roofEsp.state.heartbeat]
    ];

    function renderRoofStatus() {
      const container = document.getElementById('roofStatus');
      statusDefinitions.forEach(([label, key, topic]) => {
        const row = makeElement('div', 'flex min-h-[2.1rem] items-center justify-between gap-2 rounded-md border px-2 py-1');
        row.style.borderColor = 'var(--border)';
        row.style.background = 'var(--panel-subtle)';
        row.appendChild(makeElement('span', 'text-[.6rem] font-extrabold uppercase tracking-wide text-[var(--muted-soft)]', label));
        const value = makeElement('span', 'truncate text-right text-[.66rem] font-bold text-[var(--muted)]', 'Waiting');
        row.appendChild(value);
        container.appendChild(row);
        statusValueEls[topic] = { element: value, key };
        topics.add(topic);
      });
    }

    function renderSensors() {
      const container = document.getElementById('sensorsContainer');
      const cards = [];
      (config.sensors || []).forEach(sensor => {
        const card = makeElement('div', 'flex min-h-[2.7rem] items-center justify-between gap-2 rounded-lg border px-2.5 py-1.5');
        card.style.borderColor = 'var(--border)';
        card.style.background = 'var(--panel-subtle)';
        const identity = makeElement('div', 'flex min-w-0 items-center gap-2');
        const dot = makeElement('span', 'h-2 w-2 flex-none rounded-full bg-slate-400');
        const name = makeElement('span', 'truncate text-[.7rem] font-bold', sensor.name || sensor.path);
        identity.append(dot, name);
        if (sensor.influxMeasurement && sensor.influxField) {
          const history = makeElement('a', 'text-[var(--blue)]');
          history.href = `history.html?sensor=${encodeURIComponent(sensor.path)}`;
          history.setAttribute('aria-label', `${sensor.name} history`);
          history.innerHTML = '<i class="fa-solid fa-chart-line" aria-hidden="true"></i>';
          identity.appendChild(history);
        }
        const value = makeElement('span', 'flex-none font-mono text-[.76rem] font-bold tabular-nums', '--');
        card.append(identity, value);
        container.appendChild(card);
        cards.push(card);
        sensorValueEls[sensor.path] = { element: value, unit: sensor.unit || '' };
        sensorIndicators[sensor.path] = {
          dot, green: Number.parseFloat(sensor.green), direction: sensor.greenDirection || 'below', isGreen: false, hasValue: false
        };
        topics.add(sensor.path);
        staticTopics.add(sensor.path);
      });
      if (!cards.length) container.appendChild(makeElement('p', 'col-span-2 text-xs font-semibold text-[var(--muted)]', 'No sensors configured.'));
      const pager = createPager(document.getElementById('sensorPager'), 8, (page, size) => {
        cards.forEach((card, index) => { card.hidden = index < page * size || index >= (page + 1) * size; });
      });
      pager.setCount(cards.length);
    }

    function renderDevices() {
      const container = document.getElementById('devicesContainer');
      const cards = [];
      (config.roofController?.relays || []).filter(relay => relay.visible !== false).forEach(relay => {
        const stateTopic = `${baseTopic}/state/${relay.key}`;
        const commandTopic = `${baseTopic}/command/${relay.key}`;
        cards.push(createToggle(relay.label, stateTopic, commandTopic, 'relay'));
      });
      (config.switches || []).forEach(device => {
        cards.push(createToggle(device.name || device.statusPath, device.statusPath || device.path, device.commandPath || device.path));
      });
      cards.forEach(card => container.appendChild(card));
      if (!cards.length) container.appendChild(makeElement('p', 'text-xs font-semibold text-[var(--muted)]', 'No devices configured.'));
      const pager = createPager(document.getElementById('devicePager'), 6, (page, size) => {
        cards.forEach((card, index) => { card.hidden = index < page * size || index >= (page + 1) * size; });
      });
      pager.setCount(cards.length);
    }

    function chartColors() {
      const dark = document.documentElement.classList.contains('dark');
      return dark
        ? { text: '#cbd5e1', muted: '#94a3b8', grid: '#334155', tooltip: '#172033', border: '#475569' }
        : { text: '#334155', muted: '#64748b', grid: '#cbd5e1', tooltip: '#ffffff', border: '#94a3b8' };
    }

    function initChart() {
      if (!config.dashboard?.showChart) return;
      const colors = chartColors();
      const sensors = config.sensors || [];
      lineChart = Highcharts.chart('lineChart', {
        chart: { type: 'line', backgroundColor: 'transparent', animation: false, marginTop: 8, spacing: [4, 4, 4, 4] },
        title: { text: null },
        xAxis: { type: 'datetime', lineColor: colors.grid, tickColor: colors.grid, labels: { style: { color: colors.muted, fontSize: '9px' } } },
        yAxis: sensors.map((sensor, index) => ({
          title: { text: index < 2 ? (sensor.unit || sensor.name) : null, style: { color: colors.muted, fontSize: '9px' } },
          labels: { enabled: index < 2, style: { color: colors.muted, fontSize: '9px' } },
          gridLineColor: colors.grid, opposite: index % 2 === 1
        })),
        legend: { itemStyle: { color: colors.text, fontSize: '9px' }, itemHoverStyle: { color: colors.text }, symbolWidth: 14, itemDistance: 8 },
        tooltip: { shared: true, backgroundColor: colors.tooltip, borderColor: colors.border, style: { color: colors.text } },
        series: sensors.map((sensor, index) => {
          const green = Number.parseFloat(sensor.green);
          let zones;
          if (!Number.isNaN(green)) zones = sensor.greenDirection === 'above' ? [{ value: green, dashStyle: 'Dot' }, {}] : [{ value: green }, { dashStyle: 'Dot' }];
          return { name: sensor.name, data: [], yAxis: index, zones, marker: { enabled: false }, lineWidth: 1.5, tooltip: { valueSuffix: sensor.unit ? ` ${sensor.unit}` : '' } };
        }),
        credits: { enabled: false },
        accessibility: { enabled: false }
      });
      sensors.forEach((sensor, index) => { lineSeries[sensor.path] = lineChart.series[index]; });
    }

    function applyChartTheme() {
      if (!lineChart) return;
      const colors = chartColors();
      lineChart.update({
        xAxis: { lineColor: colors.grid, tickColor: colors.grid, labels: { style: { color: colors.muted } } },
        yAxis: lineChart.yAxis.map(() => ({ gridLineColor: colors.grid, labels: { style: { color: colors.muted } }, title: { style: { color: colors.muted } } })),
        legend: { itemStyle: { color: colors.text }, itemHoverStyle: { color: colors.text } },
        tooltip: { backgroundColor: colors.tooltip, borderColor: colors.border, style: { color: colors.text } }
      }, true, true);
    }

    function configureDashboardVisibility() {
      const chartCard = document.getElementById('chartCard');
      const sensorCard = document.getElementById('sensorCard');
      const skyCard = document.getElementById('skyCamCard');
      const deviceCard = document.getElementById('devicesCard');
      const showChart = config.dashboard?.showChart !== false;
      const showSky = config.dashboard?.showSkyCam !== false && !!config.skyCamTopic;
      chartCard.hidden = !showChart;
      sensorCard.classList.toggle('dashboard-fill-column', !showChart);
      skyCard.hidden = !showSky;
      deviceCard.classList.toggle('dashboard-fill-column', !showSky);
      if (showSky) {
        topics.add(config.skyCamTopic);
        staticTopics.add(config.skyCamTopic);
      }
    }

    function setupMaximize() {
      const backdrop = document.getElementById('modalBackdrop');
      function close() {
        if (!activeMaximized) return;
        activeMaximized.classList.remove('ops-maximized');
        activeMaximized = null;
        backdrop.hidden = true;
        document.body.classList.remove('overflow-hidden');
        maximizeTrigger?.setAttribute('aria-expanded', 'false');
        maximizeTrigger?.querySelector('i')?.classList.replace('fa-compress', 'fa-expand');
        maximizeTrigger?.focus();
        setTimeout(() => lineChart?.reflow(), 60);
      }
      document.querySelectorAll('[data-maximize]').forEach(button => {
        button.addEventListener('click', () => {
          const card = document.getElementById(button.dataset.maximize);
          if (activeMaximized === card) { close(); return; }
          activeMaximized = card;
          maximizeTrigger = button;
          card.classList.add('ops-maximized');
          backdrop.hidden = false;
          document.body.classList.add('overflow-hidden');
          button.setAttribute('aria-expanded', 'true');
          button.querySelector('i')?.classList.replace('fa-expand', 'fa-compress');
          setTimeout(() => lineChart?.reflow(), 60);
        });
      });
      backdrop.addEventListener('click', close);
      document.addEventListener('keydown', event => { if (event.key === 'Escape') close(); });
    }

    function setupPowerInterlock() {
      const dialog = document.getElementById('powerInterlockDialog');
      const backdrop = document.getElementById('powerDialogBackdrop');
      const dismiss = document.getElementById('dismissPowerDialog');
      const close = () => {
        if (dialog.hidden) return;
        dialog.hidden = true;
        backdrop.hidden = true;
        document.body.classList.remove('overflow-hidden');
        dialog._returnFocus?.focus();
      };
      dismiss.addEventListener('click', close);
      backdrop.addEventListener('click', close);
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !dialog.hidden) close();
      });
    }

    function showPowerInterlock(action) {
      const dialog = document.getElementById('powerInterlockDialog');
      const message = document.getElementById('powerDialogMessage');
      dialog._returnFocus = document.activeElement;
      const stateUnknown = !(powerRelayStateTopic in stateValues) || stateValues[powerRelayStateTopic] === null;
      message.textContent = stateUnknown
        ? `${powerRelayLabel} has not reported that it is on. Confirm the 12V supply is on before trying to ${action} the roof.`
        : `${powerRelayLabel} is off. Turn it on in Devices before trying to ${action} the roof.`;
      document.getElementById('powerDialogBackdrop').hidden = false;
      dialog.hidden = false;
      document.body.classList.add('overflow-hidden');
      document.getElementById('dismissPowerDialog').focus();
    }

    function updateConnectionStatus(status) {
      const chip = document.getElementById('connectionStatus');
      const text = document.getElementById('statusText');
      const icon = chip.querySelector('i');
      const values = {
        connecting: ['Connecting', 'warn', 'fa-circle-notch', true], connected: ['Connected', 'good', 'fa-circle', false],
        reconnecting: ['Reconnecting', 'warn', 'fa-rotate', true], disconnected: ['Disconnected', 'bad', 'fa-plug-circle-xmark', false],
        error: ['Connection error', 'bad', 'fa-triangle-exclamation', false]
      };
      const [label, tone, iconName, spin] = values[status] || values.disconnected;
      text.textContent = label;
      setTone(chip, tone);
      icon.className = `fa-solid ${iconName}${spin ? ' fa-spin' : ''}`;
      mqttConnected = status === 'connected';
      setControlsDisabled(!mqttConnected);
      updateRoofSafety();
    }

    function setControlsDisabled(disabled) {
      document.querySelectorAll('#roofControls button, #devicesContainer button').forEach(button => { button.disabled = disabled; });
    }

    function sendCommand(topic, payload, label) {
      if (!mqttClient || !mqttConnected || !topic) return;
      mqttClient.publish(topic, payload, { qos: 1 });
      document.getElementById('lastCommand').textContent = `${label} · ${new Date().toLocaleTimeString('en-GB')}`;
    }

    function formatRoofValue(key, value) {
      if (key === 'online') return [value === '1' ? 'Online' : 'Offline', value === '1' ? 'good' : 'bad'];
      if (key === 'moving') return [value === '1' ? 'Moving' : 'Stopped', value === '1' ? 'warn' : 'good'];
      if (key === 'openLimit') return [value === '1' ? 'Open' : 'Not open', value === '1' ? 'warn' : null];
      if (key === 'closeLimit') return [value === '1' ? 'Closed' : 'Not closed', value === '1' ? 'good' : 'warn'];
      if (key === 'openMotor' || key === 'closeMotor') return [value === '1' ? 'Active' : 'Idle', value === '1' ? 'warn' : null];
      if (key === 'enabled') return [value === '1' ? 'Enabled' : 'Disabled', value === '1' ? 'good' : 'bad'];
      if (key === 'fault') return [value === '1' ? 'Fault' : 'Clear', value === '1' ? 'bad' : 'good'];
      if (key === 'faultCode') return [!value || value === '0' ? 'None' : (faultLabels[value] || value), !value || value === '0' ? 'good' : 'bad'];
      return [value, null];
    }

    function updateRoofStatus(topic, rawValue) {
      const status = statusValueEls[topic];
      if (!status) return;
      if (status.key === 'heartbeat') {
        lastHeartbeatAt = new Date();
        updateHeartbeat();
        return;
      }
      const [label, tone] = formatRoofValue(status.key, rawValue);
      status.element.textContent = label;
      status.element.style.color = tone ? `var(--${tone === 'good' ? 'green' : tone === 'warn' ? 'amber' : 'red'})` : 'var(--muted)';
    }

    function updateHeartbeat() {
      const status = statusValueEls[roofEsp.state.heartbeat];
      if (!status) return;
      if (!lastHeartbeatAt) {
        status.element.textContent = 'Waiting';
        status.element.style.color = 'var(--amber)';
      } else {
        const stale = Date.now() - lastHeartbeatAt.getTime() > 90000;
        status.element.textContent = stale ? 'Stale' : lastHeartbeatAt.toLocaleTimeString('en-GB');
        status.element.style.color = stale ? 'var(--red)' : 'var(--green)';
      }
      updateRoofSafety();
    }

    function updateRoofSafety() {
      const open = stateValues[roofEsp.state.openLimit] === '1';
      const closed = stateValues[roofEsp.state.closeLimit] === '1';
      const moving = stateValues[roofEsp.state.moving] === '1';
      const fault = stateValues[roofEsp.state.fault] === '1';
      const enabled = stateValues[roofEsp.state.enabled];
      const online = stateValues[roofEsp.state.online];
      const heartbeatStale = lastHeartbeatAt && Date.now() - lastHeartbeatAt.getTime() > 90000;
      const motorAllowed = mqttConnected && online !== '0' && !heartbeatStale;
      const baseAllowed = enabled !== '0' && !fault;
      roofMotionButtons.open.disabled = !motorAllowed || !baseAllowed || open;
      roofMotionButtons.close.disabled = !motorAllowed || !baseAllowed || closed;
      roofMotionButtons.stop.disabled = !motorAllowed;
      relayToggleButtons.forEach(button => { button.disabled = !mqttConnected || online === '0' || moving; });

      const badge = document.getElementById('roofMovingBadge');
      badge.hidden = !moving;
      const summary = document.getElementById('roofSummary');
      const card = document.getElementById('roofCard');
      let label = 'Roof waiting';
      let tone = 'warn';
      if (fault) { label = 'Roof fault'; tone = 'bad'; }
      else if (moving) { label = 'Roof moving'; tone = 'warn'; }
      else if (closed) { label = 'Roof closed'; tone = 'good'; }
      else if (open) { label = 'Roof open'; tone = 'warn'; }
      summary.querySelector('span').textContent = label;
      setTone(summary, tone);
      card.dataset.tone = tone;
    }

    function updateSensor(topic, rawValue) {
      const target = sensorValueEls[topic];
      if (!target) return;
      const numeric = Number.parseFloat(rawValue);
      const display = Number.isNaN(numeric) ? rawValue : String(Math.round(numeric * 10) / 10);
      target.element.textContent = target.unit ? `${display} ${target.unit}` : display;
      const indicator = sensorIndicators[topic];
      indicator.hasValue = true;
      indicator.isGreen = !Number.isNaN(numeric) && !Number.isNaN(indicator.green) && (indicator.direction === 'above' ? numeric >= indicator.green : numeric <= indicator.green);
      indicator.dot.className = `h-2 w-2 flex-none rounded-full ${indicator.isGreen ? 'bg-emerald-500' : 'bg-rose-500'}`;
      const values = Object.values(sensorIndicators);
      const received = values.filter(item => item.hasValue).length;
      const safe = values.length > 0 && values.every(item => item.hasValue && item.isGreen);
      const summary = document.getElementById('sensorSummary');
      summary.textContent = safe ? 'All safe' : `${received}/${values.length} received`;
      setTone(summary, safe ? 'good' : 'warn');
      document.getElementById('sensorCard').dataset.tone = safe ? 'good' : '';
      const series = lineSeries[topic];
      if (series && !Number.isNaN(numeric)) series.addPoint([Date.now(), Math.round(numeric * 10) / 10], true, series.data.length >= 50);
    }

    renderRoofControls();
    renderRoofStatus();
    renderSensors();
    renderDevices();
    configureDashboardVisibility();
    initChart();
    setupMaximize();
    setupPowerInterlock();
    window.addEventListener('observatory-theme-change', applyChartTheme);
    setInterval(updateHeartbeat, 5000);

    if (!configLoaded || !config.brokerUrl) {
      updateConnectionStatus('error');
    } else {
      try {
        const url = new URL(config.brokerUrl);
        if (config.port) url.port = config.port;
        mqttClient = createClient({ brokerUrl: url.toString(), options: { username: config.username, password: config.password } });
        mqttClient.on('status', updateConnectionStatus);
        mqttClient.on('error', error => console.error('MQTT client error:', error));
        mqttClient.on('connect', () => {
          topics.forEach(topic => {
            mqttClient.subscribe(topic);
            if (!staticTopics.has(topic)) stateValues[topic] = null;
          });
        });
        mqttClient.on('message', (topic, message) => {
          if (topic === config.skyCamTopic) {
            const image = document.getElementById('skyCamImage');
            const url = URL.createObjectURL(new Blob([message]));
            if (image.dataset.objectUrl) URL.revokeObjectURL(image.dataset.objectUrl);
            image.src = url;
            image.dataset.objectUrl = url;
            image.hidden = false;
            document.getElementById('skyCamWaiting').hidden = true;
            return;
          }
          const rawValue = message.toString();
          stateValues[topic] = rawValue;
          updateSensor(topic, rawValue);
          updateRoofStatus(topic, rawValue);
          const toggle = toggleButtonsByTopic[topic];
          if (toggle) setToggleVisual(toggle.button, rawValue, toggle.state);
          updateRoofSafety();
        });
      } catch (error) {
        console.error('MQTT initialization failed:', error);
        updateConnectionStatus('error');
      }
    }
  </script>
</body>
</html>
